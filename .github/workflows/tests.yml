

name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: social_media_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d social_media_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          APP_NAME: Social Media API
          DEBUG: "False"
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/social_media_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/social_media_test
          SECRET_KEY: github-actions-test-secret-key-at-least-32-bytes
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: |
          pytest -v
